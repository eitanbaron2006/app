name: Emerald Mahjong v5 Android APK
on:
  push:
    branches:
      - artifact/emerald-mahjong-v5-apk
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile Android APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Verify APK and signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | head -12
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Emerald-Mahjong-v5-APK
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Verify startup in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -W -n com.emerald.mahjongv5/com.emerald.mahjong.MainActivity
            sleep 12
            adb logcat -d -s AndroidRuntime:E EmeraldMahjong:E > android-startup-log.txt
            cat android-startup-log.txt
            ! grep -E 'FATAL EXCEPTION|Could not open game|Missing game asset|JS:' android-startup-log.txt
            adb shell pidof com.emerald.mahjongv5
      - name: Upload startup log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Emerald-Mahjong-v5-startup-log
          path: android-startup-log.txt
          if-no-files-found: ignore
