name: Emerald Mahjong v13 Android APK
on:
  push:
    branches:
      - artifact/emerald-mahjong-v13-level-journey
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Reconstruct complete offline game from source chunks
        run: python3 scripts/assemble_v13.py
      - name: Compile Android APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Verify APK and signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | head -12
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Emerald-Mahjong-v13-APK
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Upload offline HTML
        uses: actions/upload-artifact@v4
        with:
          name: Emerald-Mahjong-v13-HTML
          path: app/src/main/assets/index.html
